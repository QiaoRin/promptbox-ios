<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PromptBox · 提示词盒子</title>
<style>
  :root{
    --glass:rgba(255,255,255,.66);
    --glass-strong:rgba(255,255,255,.84);
    --line:rgba(255,255,255,.72);
    --line-soft:rgba(120,140,165,.18);
    --ink:#2C3A48;
    --ink-2:#62748A;
    --ink-3:#9AA9BA;
    --primary:#82AEDB;
    --primary-deep:#6395C4;
    --chip:rgba(130,174,219,.14);
    --cream:#F7F1E8;
    --star:#E8A94E;
    --danger:#D98A8A;
    --danger-bg:rgba(217,138,138,.12);
    --radius:22px;
    --radius-ctrl:16px;
    --shadow:0 10px 28px rgba(120,140,170,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  html,body{height:100%;touch-action:manipulation;overscroll-behavior:none}
  body{
    font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(165deg,#EAF1F6 0%,#F7F2EC 55%,#EDF2F7 100%);
    color:var(--ink);
    min-height:100dvh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body::before,body::after{
    content:'';position:fixed;border-radius:50%;filter:blur(70px);z-index:0;pointer-events:none;
  }
  body::before{width:340px;height:340px;background:rgba(178,205,228,.32);top:-80px;left:-60px}
  body::after{width:300px;height:300px;background:rgba(226,211,196,.28);bottom:-60px;right:-50px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}

  .phone{
    position:relative;z-index:1;
    max-width:560px;margin:0 auto;min-height:100dvh;
    display:flex;flex-direction:column;
    --pad:max(16px,calc((100vw - 560px)/2 + 16px));
  }

  /* ---------- 顶栏 ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:10px;
    padding:calc(16px + env(safe-area-inset-top)) 16px 10px;
    background:rgba(242,246,251,.55);
    backdrop-filter:blur(18px) saturate(1.3);
    -webkit-backdrop-filter:blur(18px) saturate(1.3);
  }
  .icon-btn{
    width:40px;height:40px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-2);flex:none;
  }
  .icon-btn:active{background:var(--chip)}
  .brand-logo{width:38px;height:38px;object-fit:contain;flex:none}
  .brand{flex:1;min-width:0}
  .brand-name{font-size:20px;font-weight:700;letter-spacing:.5px}
  .brand-sub{font-size:11px;color:var(--ink-3);margin-top:2px;letter-spacing:.3px}

  /* ---------- 搜索栏 ---------- */
  .searchbar{display:flex;align-items:center;gap:8px;padding:0 16px 10px}
  .searchbar input{
    flex:1;height:42px;border:1px solid var(--line);border-radius:var(--radius-ctrl);
    background:var(--glass);padding:0 13px;outline:none;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .searchbar input:focus{border-color:var(--primary)}

  /* ---------- 分类胶囊 ---------- */
  .catbar{
    display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;
    scrollbar-width:none;touch-action:pan-x;
  }
  .catbar::-webkit-scrollbar{display:none}
  .capsule{
    flex:none;height:36px;padding:0 16px;border-radius:20px;
    background:var(--glass);border:1px solid var(--line);
    color:var(--ink-2);font-size:13px;display:flex;align-items:center;gap:5px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .capsule.active{
    background:var(--primary);border-color:var(--primary);color:#fff;font-weight:500;
    box-shadow:0 6px 16px rgba(91,140,201,.32);
  }
  .capsule.add{color:var(--primary);border-style:dashed}
  .subbar{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none;touch-action:pan-x}
  .subbar::-webkit-scrollbar{display:none}
  .capsule.sub{height:32px;padding:0 13px;font-size:12.5px;border-radius:17px;background:var(--chip)}
  .capsule.sub.add{color:var(--primary)}

  /* ---------- 视图 ---------- */
  .view{padding:0 16px 24px}
  .list{display:flex;flex-direction:column;gap:14px}

  /* ---------- 卡片：左图右文，玻璃 ---------- */
  .card{
    background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:13px;
    display:flex;gap:13px;align-items:stretch;
    backdrop-filter:blur(16px) saturate(1.2);
    -webkit-backdrop-filter:blur(16px) saturate(1.2);
  }
  .card-thumb{
    width:104px;height:104px;flex:none;border-radius:16px;
    background:var(--cream);overflow:hidden;position:relative;
    display:flex;align-items:center;justify-content:center;color:var(--ink-3);
  }
  .card-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .card-thumb .thumb-logo{object-fit:contain;padding:10px}
  .card-thumb .thumb-ph{object-fit:cover;padding:0}
  .card-body{flex:1;min-width:0;display:flex;flex-direction:column}
  .card-title{font-size:14px;font-weight:600;color:var(--ink);line-height:1.5;margin-bottom:4px}
  .card-text{
    font-size:13.5px;color:var(--ink-2);line-height:1.65;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card-meta{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:9px}
  .time{font-size:11.5px;color:var(--ink-3)}
  .card-ops{display:flex;gap:4px}
  .op{
    width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);
  }
  .op:active{background:var(--chip)}
  .op.fav{color:var(--star)}

  /* ---------- 空态 ---------- */
  .empty{
    margin-top:60px;border:1.5px dashed var(--line-soft);border-radius:var(--radius);
    padding:44px 24px;text-align:center;color:var(--ink-3);
    background:rgba(255,255,255,.3);
  }
  .empty .empty-title{font-size:15px;color:var(--ink-2);margin-bottom:6px}
  .empty p{font-size:13px;line-height:1.7}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;right:var(--pad);bottom:calc(28px + env(safe-area-inset-bottom));z-index:25;
    width:56px;height:56px;border-radius:20px;
    background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 26px rgba(130,174,219,.4);
  }
  .fab:active{transform:scale(.95)}

  /* ---------- 详情 ---------- */
  .detail-head{display:flex;align-items:center;gap:6px;padding:10px 0 14px}
  .detail-title{flex:1;font-size:16px;font-weight:600;text-align:center}
  .detail-img{border-radius:var(--radius);overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow);background:var(--cream)}
  .detail-img img{width:100%;display:block}
  .detail-img .detail-logo{object-fit:cover;padding:0;height:auto}
  .detail-body h2{font-size:20px;line-height:1.4;margin-bottom:10px}
  .detail-text{font-size:15px;line-height:1.8;color:var(--ink-2);margin:14px 0}
  .detail-meta{font-size:12px;color:var(--ink-3);margin-bottom:18px}
  .detail-actions{display:flex;flex-direction:column;gap:10px}

  .primary-btn{
    height:46px;border-radius:var(--radius-ctrl);background:var(--primary);color:#fff;
    font-size:15px;font-weight:500;box-shadow:0 8px 20px rgba(91,140,201,.3);
  }
  .primary-btn:active{background:var(--primary-deep)}
  .ghost-btn{
    height:46px;border-radius:var(--radius-ctrl);background:var(--glass);border:1px solid var(--line);
    color:var(--ink-2);font-size:15px;
  }
  .danger-btn{
    height:46px;border-radius:var(--radius-ctrl);background:var(--danger-bg);color:var(--danger);
    font-size:15px;
  }

  /* ---------- 编辑表单 ---------- */
  .edit-head{display:flex;align-items:center;gap:6px;padding:10px 0 16px}
  .edit-head h2{flex:1;font-size:16px;font-weight:600;text-align:center}
  .edit-head .primary-btn{width:72px;height:40px;font-size:14px;border-radius:11px}
  .form{display:flex;flex-direction:column;gap:18px}
  .form label{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--ink-2)}
  .form input[type=text],.form select,.form textarea{
    width:100%;border:1px solid var(--line);border-radius:var(--radius-ctrl);
    background:var(--glass);padding:13px;outline:none;font-size:16px;
  }
  .form input:focus,.form select:focus,.form textarea:focus{border-color:var(--primary)}
  .form textarea{resize:vertical;min-height:160px;line-height:1.7}
  .field-label{font-size:13px;color:var(--ink-2);margin-bottom:8px}
  .img-upload{display:flex;flex-direction:column;gap:10px}
  .preview{position:relative;border-radius:var(--radius-ctrl);overflow:hidden}
  .preview img{width:100%;max-height:200px;object-fit:cover;display:block}
  .upload-btn{
    height:92px;border:1.5px dashed var(--line-soft);border-radius:var(--radius-ctrl);
    color:var(--ink-3);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
    background:rgba(255,255,255,.25);
  }
  .upload-btn:active{border-color:var(--primary);color:var(--primary)}
  .upload-btn.drag-over{border-color:var(--primary);color:var(--primary);background:rgba(91,140,201,.1)}
  .remove-img{
    position:absolute;top:10px;right:10px;height:32px;padding:0 12px;border-radius:10px;
    background:rgba(34,48,63,.72);color:#fff;font-size:12px;
  }

  /* ---------- 抽屉 ---------- */
  .mask{position:fixed;inset:0;background:rgba(50,68,90,.28);z-index:30;backdrop-filter:blur(3px)}
  .drawer{
    position:fixed;top:0;left:0;bottom:0;width:290px;z-index:31;
    background:var(--glass-strong);box-shadow:10px 0 34px rgba(50,68,90,.2);
    backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
    transform:translateX(-100%);transition:transform .24s ease;
    display:flex;flex-direction:column;
  }
  .drawer.open{transform:translateX(0)}
  .drawer-head{padding:calc(24px + env(safe-area-inset-top)) 18px 14px;font-size:17px;font-weight:700}
  .drawer-list{flex:1;overflow-y:auto;padding:0 12px}
  .drawer-row{
    display:flex;align-items:center;gap:8px;padding:13px 10px;border-radius:14px;
    touch-action:pan-y;user-select:none;-webkit-user-select:none;
  }
  .drawer-row:active{background:var(--chip)}
  .drawer-row.dragging{opacity:.65;transform:scale(1.02);box-shadow:var(--shadow);background:var(--glass-strong);z-index:2}
  .drag-handle{color:var(--ink-3);display:flex;align-items:center;flex:none}
  .drawer-row-name{flex:1;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini-btn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);flex:none}
  .mini-btn.danger{color:var(--danger)}
  .drawer-row.sub{padding-left:30px}
  .drawer-row .sub-name{font-size:13.5px;color:var(--ink-2)}
  .mini-btn.addsub{color:var(--primary)}
  .arrow{width:20px;min-width:20px;max-width:20px;flex:0 0 20px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--ink-3);transition:transform .18s ease}
  .arrow.open{transform:rotate(90deg)}
  .arrow.empty{visibility:hidden;flex:0 0 20px;width:20px;min-width:20px;max-width:20px;padding:0}
  .drawer-tools{padding:10px 14px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
  .tool-btn{height:40px;border-radius:12px;background:var(--glass);border:1px solid var(--line);color:var(--ink-2);font-size:13.5px;letter-spacing:.3px}
  .tool-btn:active{background:var(--chip)}
  .drawer-foot{padding:calc(14px + env(safe-area-inset-bottom)) 18px 14px;font-size:11.5px;color:var(--ink-3)}

  /* ---------- 弹窗 ---------- */
  .modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(50,68,90,.28);backdrop-filter:blur(4px)}
  .modal-card{
    width:100%;max-width:320px;background:var(--glass-strong);border:1px solid var(--line);
    border-radius:24px;padding:22px;box-shadow:var(--shadow);
    backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  }
  .modal-title{font-size:16px;font-weight:600;margin-bottom:14px}
  .confirm-msg{font-size:13.5px;color:var(--ink-2);line-height:1.7}
  .modal-card input{
    width:100%;height:45px;border:1px solid var(--line);border-radius:13px;padding:0 13px;outline:none;background:rgba(255,255,255,.55);
  }
  .modal-card input:focus{border-color:var(--primary)}
  .modal-card select{
    width:100%;height:45px;border:1px solid var(--line);border-radius:13px;
    padding:0 13px;outline:none;background:rgba(255,255,255,.55);margin-top:0;
  }
  .modal-card select:focus{border-color:var(--primary)}
  .modal-actions{display:flex;gap:10px;margin-top:18px}
  .modal-actions button{flex:1;height:43px;border-radius:13px;font-size:14px}
  .modal-cancel{background:var(--chip);color:var(--ink-2)}
  .modal-ok{background:var(--primary);color:#fff}

  /* ---------- Toast / 页脚 ---------- */
  .toast{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:50;
    background:rgba(34,48,63,.86);color:#fff;font-size:13px;padding:10px 18px;border-radius:14px;
    white-space:nowrap;
  }
  .foot{
    position:static;z-index:15;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    margin-top:auto;
    padding:20px 16px calc(12px + env(safe-area-inset-bottom));
    text-align:center;letter-spacing:.4px;pointer-events:none;
  }
  .foot-brand{font-size:11px;color:var(--ink-3)}
  .foot-mail{font-size:11px;color:var(--ink-3);text-decoration:none;pointer-events:auto}
  .foot-mail:active{color:var(--primary)}
</style>
</head>

/* ================= IndexedDB：图片 Blob ================= */
const DB = {
  _db: null,
  _ok: true,
  open(){
    return new Promise((res, rej) => {
      if (!this._ok) return rej(new Error('idb unavailable'));
      if (this._db) return res(this._db);
      let r;
      try { r = indexedDB.open('promptclip-imgs', 1); }
      catch (err){ this._ok = false; return rej(err); }
      r.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('images')) db.createObjectStore('images', { keyPath: 'id' });
      };
      r.onsuccess = () => { this._db = r.result; res(this._db); };
      r.onerror = () => { this._ok = false; rej(r.error); };
    });
  },
  async put(rec){
    if (!this._ok) return;
    try {
      const db = await this.open();
      return new Promise((res, rej) => {
        const tx = db.transaction('images', 'readwrite');
        tx.objectStore('images').put(rec);
        tx.oncomplete = res;
        tx.onerror = () => { this._ok = false; rej(tx.error); };
      });
    } catch (e){ this._ok = false; }
  },
  async get(id){
    if (!this._ok) return null;
    try {
      const db = await this.open();
      return new Promise((res, rej) => {
        const q = db.transaction('images').objectStore('images').get(id);
        q.onsuccess = () => res(q.result || null);
        q.onerror = () => { this._ok = false; rej(q.error); };
      });
    } catch (e){ this._ok = false; return null; }
  },
  async del(id){
    if (!this._ok) return;
    try {
      const db = await this.open();
      return new Promise((res, rej) => {
        const tx = db.transaction('images', 'readwrite');
        tx.objectStore('images').delete(id);
        tx.oncomplete = res;
        tx.onerror = () => { this._ok = false; rej(tx.error); };
      });
    } catch (e){ this._ok = false; }
  }
};

const urlCache = new Map();
async function imageURL(imageId){
  if (!imageId) return null;
  if (urlCache.has(imageId)) return urlCache.get(imageId);
  try {
    const rec = await DB.get(imageId);
    if (!rec || !rec.blob) return null;
    const u = URL.createObjectURL(rec.blob);
    urlCache.set(imageId, u);
    return u;
  } catch (e){ return null; }
}

function fileToBlob(file, maxW = 1200){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      const mime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
      if (mime === 'image/jpeg'){ ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
      ctx.drawImage(img, 0, 0, w, h);
      c.toBlob(b => {
        URL.revokeObjectURL(url);
        b ? resolve(b) : reject(new Error('encode failed'));
      }, mime, 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode failed')); };
    img.src = url;
  });
}

/* ================= 状态：localStorage ================= */
const LS_KEY = 'promptbox.state.v4';
const LEGACY_KEYS = ['promptclip.state.v1', 'promptbox.state.v1', 'promptbox.state.v2', 'promptbox.state.v3'];
let state = { categories: [], prompts: [] };
let activeCategory = 'all';
let activeSub = 'all';
let searchQuery = '';

function persist(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }

function clearLegacy(){
  LEGACY_KEYS.forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
}

function displayTitle(p){
  return (p.title || '').trim();
}

function seed(){
  const now = Date.now(), day = 86400000;
  const mk = (name, parentId = null) => ({ id: uid(), name, parentId, createdAt: now });
  const gufeng = mk('古风'), xiandai = mk('现代'), lifu = mk('礼服');
  const gSpring = mk('春', gufeng.id), gSummer = mk('夏', gufeng.id), gAutumn = mk('秋', gufeng.id), gWinter = mk('冬', gufeng.id);
  const xSpring = mk('春', xiandai.id), xSummer = mk('夏', xiandai.id), xAutumn = mk('秋', xiandai.id), xWinter = mk('冬', xiandai.id);
  const lLong = mk('长款', lifu.id), lShort = mk('短款', lifu.id);
  state = {
    categories: [
      gufeng, xiandai, lifu,
      gSpring, gSummer, gAutumn, gWinter,
      xSpring, xSummer, xAutumn, xWinter,
      lLong, lShort
    ],
    prompts: [
      { id: uid(), categoryId: gufeng.id, subCategoryId: gSpring.id, body: '这是一块奥利奥', imageId: 'logo', createdAt: now - day * 13, updatedAt: now - day * 13 },
      { id: uid(), categoryId: xiandai.id, subCategoryId: xSummer.id, body: '这是一块奥利奥', imageId: 'logo', createdAt: now - day * 17, updatedAt: now - day * 17 },
      { id: uid(), categoryId: lifu.id, subCategoryId: lLong.id, body: '这是一块奥利奥', imageId: 'logo', createdAt: now - day * 18, updatedAt: now - day * 18 }
    ]
  };
  persist();
}

function normalize(){
  const cats = state.categories || [];
  const ids = new Set(cats.map(c => c.id));
  cats.forEach(c => {
    if (c.parentId === undefined || c.parentId === '' || c.parentId === c.id) c.parentId = null;
    if (c.parentId && !ids.has(c.parentId)) c.parentId = null;
  });
  // 父级本身仍是子分类的（嵌套/循环），提升为主分类，避免抽屉错位
  const parentIds = new Set(cats.filter(c => !c.parentId).map(c => c.id));
  cats.forEach(c => { if (c.parentId && !parentIds.has(c.parentId)) c.parentId = null; });
  (state.prompts || []).forEach(p => {
    if (p.subCategoryId === undefined) p.subCategoryId = null;
    if (p.categoryId && !ids.has(p.categoryId)) p.categoryId = null;
    if (p.subCategoryId && !ids.has(p.subCategoryId)) p.subCategoryId = null;
    if (!p.categoryId) p.subCategoryId = null;
  });
}

function load(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw){ state = JSON.parse(raw); normalize(); clearLegacy(); return; }
  } catch (e) { /* 数据损坏则重置 */ }
  clearLegacy();
  seed();
}

function parentCats(){ return state.categories.filter(c => !c.parentId); }
function childCats(pid){ return state.categories.filter(c => c.parentId === pid); }
function catName(id){
  const c = state.categories.find(x => x.id === id);
  return c ? c.name : '未分类';
}

function filteredPrompts(){
  let list = [...state.prompts];
  if (activeCategory !== 'all'){
    list = list.filter(p => p.categoryId === activeCategory);
    if (activeSub !== 'all') list = list.filter(p => p.subCategoryId === activeSub);
  }
  if (searchQuery){
    const q = searchQuery.toLowerCase();
    list = list.filter(p => p.body.toLowerCase().includes(q));
  }
  list.sort((a, b) => b.updatedAt - a.updatedAt);
  return list;
}

/* ================= 渲染：分类条 ================= */
function renderCatBar(){
  const items = [
    { id: 'all', name: '全部' },
    ...parentCats().map(c => ({ id: c.id, name: c.name }))
  ];
  $('#catBar').innerHTML =
    items.map(c => `<button class="capsule ${activeCategory === c.id ? 'active' : ''}" data-cat="${c.id}">${esc(c.name)}</button>`).join('') +
    `<button class="capsule add" id="btnAddCat">新建主分类</button>`;

  $('#catBar').querySelectorAll('[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCategory = btn.dataset.cat;

function renderSubBar(){

async function copyText(text){
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制到剪贴板');
  } catch (err) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    toast('已复制到剪贴板');
  }
}

async function saveEdit(){
  const body = $('#fBody').value.trim();

  let subCategoryId = $('#fSubCategory').value || null;
  if (!categoryId) subCategoryId = null;

  if (!body){ toast('请先填写提示词正文'); return; }

  let imageId = editingImageId;
  let imageFailed = false;
  if (pendingImageBlob){
    const newId = uid();
    await DB.put({ id: newId, blob: pendingImageBlob, createdAt: Date.now() });
    if (DB._ok){
      if (editingImageId) await DB.del(editingImageId);
      imageId = newId;
    } else {
      imageId = null;
      imageFailed = true;
    }
  } else if (removeImageFlag){
    if (editingImageId) await DB.del(editingImageId);
    imageId = null;
  }

  const saveToast = imageFailed ? '文字已保存，图片未能写入本地' : '已保存';

      id: uid(),

async function deleteCategory(id){
  const c = state.categories.find(x => x.id === id);
  if (!c) return;
  const isParent = !c.parentId;
  const childIds = isParent ? childCats(id).map(x => x.id) : [];
  const used = state.prompts.filter(p => p.categoryId === id || p.subCategoryId === id).length;
  let msg;
  if (isParent){
    msg = used
      ? `「${c.name}」及其 ${childIds.length} 个细分类下有 ${used} 条提示词，删除后它们归入未分类。`
      : `确定删除主分类「${c.name}」及其细分类？`;
  } else {
    msg = used
      ? `「${c.name}」下有 ${used} 条提示词，删除后提示词保留在主分类下。`
      : `确定删除细分类「${c.name}」？`;
  }
  const ok = await askConfirm({ title: '删除分类', message: msg, okText: '删除' });
  if (!ok) return;
  const removeIds = isParent ? [id, ...childIds] : [id];
  state.categories = state.categories.filter(x => !removeIds.includes(x.id));
  state.prompts.forEach(p => {
    if (removeIds.includes(p.categoryId)) p.categoryId = null;
    if (removeIds.includes(p.subCategoryId)) p.subCategoryId = null;
    if (p.categoryId === null) p.subCategoryId = null;
  });
  if (activeCategory === id || (isParent && childIds.includes(activeCategory))){ activeCategory = 'all'; activeSub = 'all'; }
  persist();
  renderCatBar();
  renderDrawer();
  renderHome();
  toast('分类已删除');
}

/* ---- 长按拖拽 ---- */
const drag = { active:false, el:null, timer:null, pid:null };
let dragSuppressClick = false;
const drawerList = $('#drawerList');

drawerList.addEventListener('pointerdown', e => {
  const row = e.target.closest('.drawer-row.parent');
  if (!row || e.target.closest('.mini-btn')) return;
  drag.el = row;
  drag.pid = e.pointerId;
  drag.timer = setTimeout(() => {
    drag.active = true;
    dragSuppressClick = true;
    row.classList.add('dragging');
    try { drawerList.setPointerCapture(drag.pid); } catch (err) {}
    if (navigator.vibrate) navigator.vibrate(10);
  }, 280);
});

drawerList.addEventListener('pointermove', e => {
  if (!drag.active || !drag.el) return;
  const rows = [...drawerList.querySelectorAll('.drawer-row.parent')];
  const y = e.clientY;
  let inserted = false;
  for (const r of rows){
    if (r === drag.el) continue;
    const rect = r.getBoundingClientRect();
    if (y < rect.top + rect.height / 2){
      drawerList.insertBefore(drag.el, r);
      inserted = true;
      break;
    }
  }
  if (!inserted) drawerList.appendChild(drag.el);
});

function endDrag(){
  clearTimeout(drag.timer);
  if (drag.active && drag.el){
    const order = [...drawerList.querySelectorAll('.drawer-row.parent')].map(r => r.dataset.id);
    state.categories.sort((a, b) => {
      const ai = order.indexOf(a.id), bi = order.indexOf(b.id);
      return (ai < 0 ? 999 : ai) - (bi < 0 ? 999 : bi);
    });
    persist();
    renderCatBar();
  }
  if (drag.el) drag.el.classList.remove('dragging');
  drag.active = false;
  drag.el = null;
}
drawerList.addEventListener('pointerup', endDrag);
drawerList.addEventListener('pointercancel', endDrag);

    const n = catNorm(name);
    if (state.categories.some(c => catNorm(c.name) === n && (c.parentId || null) === pid)){ toast('同级下分类名称已存在'); return; }

function route(){
  const raw = (location.hash || '').replace(/^#\//, '') || '';
  const [path, qs] = raw.split('?');
  const params = new URLSearchParams(qs || '');
  if (path === 'detail'){ showDetail(params.get('id')); }
  else if (path === 'edit'){ showEdit(params.get('id')); }
  else { showView('home'); renderHome(); }
  closeDrawer();
}
window.addEventListener('hashchange', route);

/* ================= Word 导入 / 导出 / 模板 ================= */
const normBody = s => String(s ?? '').replace(/\u3000/g, ' ').replace(/\s+/g, ' ').trim();
const catNorm = name => String(name ?? '').replace(/\u3000/g, ' ').replace(/\s+/g, ' ').trim();
const rawCatName = id => { const c = state.categories.find(x => x.id === id); return c ? c.name : null; };
const dateTag = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`; };

function findParentByName(name){
  const n = catNorm(name);
  return state.categories.find(c => !c.parentId && c.name === n) || null;
}
function findChildByName(pid, name){
  const n = catNorm(name);
  return state.categories.find(c => c.parentId === pid && c.name === n) || null;
}
function ensureParent(name){
  const n = catNorm(name);
  if (!n) return null;
  let c = findParentByName(n);
  if (!c){ c = { id: uid(), name: n, parentId: null, createdAt: Date.now() }; state.categories.push(c); }
  return c;
}
function ensureChild(pid, name){
  const n = catNorm(name);
  if (!pid || !n) return null;
  let c = findChildByName(pid, n);
  if (!c){ c = { id: uid(), name: n, parentId: pid, createdAt: Date.now() }; state.categories.push(c); }
  return c;
}

/* ---- 通用下载 ---- */
function downloadBlob(name, blob){
  // iOS 壳内：通过 JS 桥接把文件交给系统分享面板
  if (window.__NATIVE_SHELL__ && window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.promptbox){
    const reader = new FileReader();
    reader.onload = () => {
      const b64 = String(reader.result || '').split(',')[1] || '';
      window.webkit.messageHandlers.promptbox.postMessage({ action: 'download', name: name, data: b64 });
    };
    reader.readAsDataURL(blob);
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function mimeFromExt(ext){ return ext === 'png' ? 'image/png' : 'image/jpeg'; }

/* ================= Word（.docx）双向：图文混排 ================= */
const xmlEsc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function blobDim(blob){
  return new Promise(res => {
    const u = URL.createObjectURL(blob); const img = new Image();
    img.onload = () => { res({ w: img.naturalWidth || 1, h: img.naturalHeight || 1 }); URL.revokeObjectURL(u); };
    img.onerror = () => { res({ w: 1, h: 1 }); URL.revokeObjectURL(u); };
    img.src = u;
  });
}

const docxTextP = text => `<w:p><w:r><w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r></w:p>`;

function docxImgPara(rid, cx, cy, n){
  return `<w:p><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">` +
    `<wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${n}" name="Picture${n}"/>` +
    `<a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">` +
    `<pic:pic><pic:nvPicPr><pic:picLocks noChangeAspect="1"/></pic:nvPicPr>` +
    `<pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>` +
    `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>` +
    `</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
}

async function buildDocx(items){
  const media = [], rels = [], bodyXml = [];
  const MAXW = 380;
  let picN = 0;
  for (let i = 0; i < items.length; i++){
    const it = items[i];
    bodyXml.push(docxTextP(`编号 ${i + 1}:`));
    bodyXml.push(docxTextP(`标题：${it.title || ''}`));
    bodyXml.push(docxTextP(`描述：${it.body || ''}`));
    bodyXml.push(docxTextP(`分类：${it.category || ''}`));
    bodyXml.push(docxTextP(`细分类：${it.sub || ''}`));
    if (it.blob){
      const dim = await blobDim(it.blob);
      const scale = Math.min(1, MAXW / dim.w);
      const cx = Math.round(dim.w * scale * 9525), cy = Math.round(dim.h * scale * 9525);
      picN++;
      const ext = it.blob.type === 'image/png' ? 'png' : 'jpeg';
      const file = `image${picN}.${ext}`, rid = `rId${picN}`;
      media.push({ file, bytes: new Uint8Array(await it.blob.arrayBuffer()) });
      rels.push(`<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${file}"/>`);
      bodyXml.push(docxImgPara(rid, cx, cy, picN));
    }
  }

  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">
<w:body>${bodyXml.join('')}<w:sectPr/></w:body></w:document>`;

  const ct = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Default Extension="png" ContentType="image/png"/>
<Default Extension="jpeg" ContentType="image/jpeg"/>
<Default Extension="jpg" ContentType="image/jpeg"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`;

  const relsRoot = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  const relsDoc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels.join('')}</Relationships>`;

  const files = {
    '[Content_Types].xml': fflate.strToU8(ct),
    '_rels/.rels': fflate.strToU8(relsRoot),
    'word/document.xml': fflate.strToU8(documentXml),
    'word/_rels/document.xml.rels': fflate.strToU8(relsDoc)
  };
  media.forEach(m => files['word/media/' + m.file] = m.bytes);
  return fflate.zipSync(files);
}

async function exportDocx(){
  const items = [];
  for (const pr of state.prompts){
    let blob = null;
    if (pr.imageId && pr.imageId !== 'logo'){
      const rec = await DB.get(pr.imageId);
      if (rec && rec.blob) blob = rec.blob;
    }
    items.push({
      title: pr.title || '',
      category: rawCatName(pr.categoryId) || '',
      sub: pr.subCategoryId ? rawCatName(pr.subCategoryId) || '' : '',
      body: pr.body, blob
    });
  }
  const zip = await buildDocx(items);
  downloadBlob(`promptbox-${dateTag()}.docx`, new Blob([zip], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' }));
  toast('已导出 Word 文档');
}

async function importDocx(file){
  let zip;
  try { zip = fflate.unzipSync(new Uint8Array(await file.arrayBuffer())); }
  catch (e){ toast('无法识别的 Word 文档'); return; }

  const docKey = Object.keys(zip).find(k => /word\/document\.xml$/i.test(k));
  if (!docKey){ toast('文档里没有正文'); return; }
  const dom = new DOMParser().parseFromString(new TextDecoder('utf-8').decode(zip[docKey]), 'application/xml');

  // rId -> media 目标
  const relMap = {};
  const relKey = Object.keys(zip).find(k => /document\.xml\.rels$/i.test(k));
  if (relKey){
    const rd = new DOMParser().parseFromString(new TextDecoder('utf-8').decode(zip[relKey]), 'application/xml');
    [...rd.getElementsByTagName('Relationship')].forEach(r => { relMap[r.getAttribute('Id')] = r.getAttribute('Target'); });
  }
  const mediaBytes = target => {
    const k = Object.keys(zip).find(x => x.toLowerCase().endsWith(String(target).toLowerCase()));
    return k ? zip[k] : null;
  };

  // 事件流：文本行 / 图片
  const events = [];
  const paras = [...dom.getElementsByTagName('*')].filter(el => el.localName === 'p');
  paras.forEach(p => {
    const text = [...p.getElementsByTagName('w:t')].map(t => t.textContent || '').join('');
    const blip = [...p.getElementsByTagName('*')].find(el => el.localName === 'blip');
    const rid = blip ? (blip.getAttribute('r:embed') || blip.getAttribute('r:link')) : null;
    if (text.trim()) events.push({ type: 'text', text });
    if (rid) events.push({ type: 'img', rid });
  });

  const joinBody = (a, b) => { a = (a || '').trim(); b = (b || '').trim(); return a && b ? a + '\n' + b : (a || b); };
  const mergeBlock = (dst, src) => {
    dst.body = joinBody(dst.body, src.body);
    if (!dst.title && src.title) dst.title = src.title;
    if (!dst.category && src.category) dst.category = src.category;
    if (!dst.sub && src.sub) dst.sub = src.sub;
    src.imgs.forEach(r => dst.imgs.push(r));
    src.body = ''; src.title = ''; src.imgs = []; src.category = ''; src.sub = '';
  };

  // 分块：以编号行为唯一边界；同一编号重复出现则并入首块
  const blocks = []; const noMap = new Map(); let cur = null;
  const newBlock = no => {
    const b = { no: no ?? null, title: '', category: '', sub: '', body: '', imgs: [] };
    blocks.push(b);
    if (no != null) noMap.set(String(no), b);
    return b;
  };
  events.forEach(ev => {
    if (ev.type === 'img'){ if (!cur) cur = newBlock(null); cur.imgs.push(ev.rid); return; }
    const t = ev.text.replace(/\u3000/g, ' ').trim(); if (!t) return;
    const nm = t.match(/^编号\s*[#:：]?\s*(\d+)/);
    if (nm){
      const no = nm[1];
      cur = noMap.has(no) ? noMap.get(no) : newBlock(no);
      return;
    }
    if (!cur) cur = newBlock(null);
    const clean = s => s.replace(/\u3000/g, ' ').trim();
    let m;
    if ((m = t.match(/^标题\s*[:：]\s*(.*)/))) { if (clean(m[1])) cur.title = clean(m[1]); }
    else if ((m = t.match(/^分类\s*[:：]\s*(.*)/))) { if (clean(m[1])) cur.category = clean(m[1]); }
    else if ((m = t.match(/^细分类\s*[:：]\s*(.*)/))) { if (clean(m[1])) cur.sub = clean(m[1]); }
    else if (/^图片\s*[:：]/.test(t)) { /* 占位标签，忽略 */ }
    else if ((m = t.match(/^描述\s*[:：]\s*(.*)/))) cur.body = joinBody(cur.body, m[1].trim());
    else cur.body = joinBody(cur.body, t);
  });

  // 编号之前的游离内容并入首个有编号块；整篇无编号时保留为单块
  if (blocks.length > 1){
    const firstNo = blocks.find(b => b.no != null);
    if (firstNo) blocks.forEach(b => { if (b !== firstNo && b.no == null) mergeBlock(firstNo, b); });
  }

  const existing = new Set(state.prompts.map(p => normBody(p.body)));
  let added = 0, dup = 0, imgOk = 0;

  for (const b of blocks){
    const body = normBody(b.body);
    if (!body) continue;
    if (existing.has(body)){ dup++; continue; }
    const parent = ensureParent(b.category);
    const child = ensureChild(parent ? parent.id : null, b.sub);
    let imageId = null;
    if (b.imgs.length){
      const rid = b.imgs[0];
      const bytes = relMap[rid] ? mediaBytes(relMap[rid]) : null;
      if (bytes){
        try {
          const ext = /\.png$/i.test(relMap[rid]) ? 'png' : 'jpeg';
          const blob = new Blob([bytes], { type: mimeFromExt(ext) });
          const nid = uid();
          await DB.put({ id: nid, blob, createdAt: Date.now() });
          if (DB._ok){ imageId = nid; imgOk++; }
        } catch (e) {}
      }
    }
    state.prompts.unshift({
      id: uid(), categoryId: parent ? parent.id : null, subCategoryId: child ? child.id : null,
      title: catNorm(b.title), body, imageId, createdAt: Date.now(), updatedAt: Date.now()
    });
    existing.add(body);
    added++;
  }
  persist();
  renderCatBar(); renderSubBar(); renderHome(); renderDrawer();
  toast(`导入完成：新增 ${added} 条${dup ? `，跳过重复 ${dup} 条` : ''}${imgOk ? `，图片 ${imgOk} 张` : ''}`);
}

async function downloadDocxTemplate(){
  const blob = await (await fetch(LOGO_URL)).blob();
  const items = [{ category: '现代', sub: '冬', body: '（这里写提示词）示例：头发梳成精致盘云发髻，点缀珍珠花簪，妆容淡雅温婉。', blob }];
  for (let i = 2; i <= 10; i++) items.push({ category: '', sub: '', body: '', blob: null });
  const zip = await buildDocx(items);
  downloadBlob('promptbox-导入模板.docx', new Blob([zip], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' }));
  toast('Word 模板已下载');
}

$('#btnExportDocx').addEventListener('click', exportDocx);
$('#btnTemplate').addEventListener('click', downloadDocxTemplate);
$('#btnImport').addEventListener('click', () => $('#backupFile').click());
$('#backupFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (f) await importDocx(f);
  e.target.value = '';
});

load();
renderCatBar();
route();

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
